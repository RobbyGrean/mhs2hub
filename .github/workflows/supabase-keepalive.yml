name: Supabase keep-alive

on:
  schedule:
    # 09:15 Asia/Bangkok every day (GitHub Actions uses UTC).
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Make a real Supabase API request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: https://jtveymfojswonzkqbqyl.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check Supabase REST API
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "Missing GitHub Actions secret: SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 30 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -o /dev/null \
            -w 'Supabase API response: HTTP %{http_code}\n' \
            "${SUPABASE_URL}/rest/v1/phonebook_records?select=id&limit=1"
