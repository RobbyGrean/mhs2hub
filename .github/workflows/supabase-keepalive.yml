name: Supabase keep-alive

on:
  schedule:
    # 09:15 Asia/Bangkok every day (GitHub Actions uses UTC).
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Make a real Supabase API request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: https://jtveymfojswonzkqbqyl.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Supabase REST API
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "Missing GitHub Actions secret: SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 30 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -o /dev/null \
            -w 'Supabase API response: HTTP %{http_code}\n' \
            "${SUPABASE_URL}/rest/v1/phonebook_records?select=id&limit=1"

      - name: Create monthly GitHub activity
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          heartbeat=".github/supabase-keepalive/$(date -u +%Y-%m).txt"
          if [[ -e "${heartbeat}" ]]; then
            echo "Monthly GitHub heartbeat already exists: ${heartbeat}"
            exit 0
          fi

          mkdir -p "$(dirname "${heartbeat}")"
          : > "${heartbeat}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${heartbeat}"
          git commit -m "chore: keep scheduled workflows active"
          git push
