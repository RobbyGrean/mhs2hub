<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดโทรศัพท์ ผอ.โรงเรียน สพป.มส.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a5276'/><text y='.9em' font-size='62' x='50%' text-anchor='middle'>📞</text></svg>">
<style>
  /* ── THEMES ───────────────────────────────────── */
  :root {
    --primary: #1a5276;
    --primary-light: #2471a3;
    --primary-pale: #dbeaf8;
    --header-from: #0b2034;
    --header-to: #1a5276;
    --accent: #b03a2e;
    --accent-light: #e74c3c;
    --bg: #eef1f7;
    --surface: #ffffff;
    --surface2: #f2f5fb;
    --text: #17202a;
    --text2: #566573;
    --text3: #a9b9c8;
    --border: #d5e0ec;
    --shadow-sm: 0 1px 4px rgba(26,82,118,0.07);
    --shadow: 0 2px 14px rgba(26,82,118,0.09);
    --shadow-md: 0 6px 24px rgba(26,82,118,0.13);
    --radius: 14px;
    --radius-sm: 9px;
    --radius-xs: 6px;
    --green: #1a7a42;
    --green-pale: #d0f0e0;
  }
  /* ทะเลเข้ม — default */
  [data-theme="navy"] {
    --primary: #1a5276; --primary-light: #2471a3; --primary-pale: #dbeaf8;
    --header-from: #0b2034; --header-to: #1a5276;
    --bg: #eef1f7; --surface2: #f2f5fb; --border: #d5e0ec;
    --shadow-sm: 0 1px 4px rgba(26,82,118,0.07);
    --shadow: 0 2px 14px rgba(26,82,118,0.09);
    --shadow-md: 0 6px 24px rgba(26,82,118,0.13);
  }
  /* ป่าเขียว */
  [data-theme="forest"] {
    --primary: #1e6b3c; --primary-light: #27ae60; --primary-pale: #d5f5e3;
    --header-from: #0b2e1a; --header-to: #1e6b3c;
    --bg: #eef5f0; --surface2: #f0f8f2; --border: #cce8d5;
    --shadow-sm: 0 1px 4px rgba(30,107,60,0.07);
    --shadow: 0 2px 14px rgba(30,107,60,0.09);
    --shadow-md: 0 6px 24px rgba(30,107,60,0.13);
  }
  /* พลบค่ำม่วง */
  [data-theme="purple"] {
    --primary: #6c3483; --primary-light: #9b59b6; --primary-pale: #f0e6f8;
    --header-from: #2c1254; --header-to: #6c3483;
    --bg: #f3eef8; --surface2: #f7f2fb; --border: #e0cef0;
    --shadow-sm: 0 1px 4px rgba(108,52,131,0.07);
    --shadow: 0 2px 14px rgba(108,52,131,0.09);
    --shadow-md: 0 6px 24px rgba(108,52,131,0.13);
  }
  /* พระอาทิตย์ตก */
  [data-theme="sunset"] {
    --primary: #b7460a; --primary-light: #e67e22; --primary-pale: #fde8d8;
    --header-from: #4a1a04; --header-to: #b7460a;
    --bg: #faf0ec; --surface2: #fdf5f1; --border: #f0d5c5;
    --shadow-sm: 0 1px 4px rgba(183,70,10,0.07);
    --shadow: 0 2px 14px rgba(183,70,10,0.09);
    --shadow-md: 0 6px 24px rgba(183,70,10,0.13);
  }

  /* ── THEME PICKER ─────────────────────────────── */
  .theme-picker {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 18px 12px;
  }
  .theme-picker-label {
    font-size: 11px; color: rgba(255,255,255,0.5);
    letter-spacing: 0.5px; margin-right: 2px;
    white-space: nowrap;
  }
  .theme-dot {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid transparent;
    cursor: pointer; transition: transform 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .theme-dot:hover { transform: scale(1.15); }
  .theme-dot.active { border-color: #fff; transform: scale(1.1); }
  .theme-dot[data-t="navy"]   { background: #2471a3; }
  .theme-dot[data-t="forest"] { background: #27ae60; }
  .theme-dot[data-t="purple"] { background: #9b59b6; }
  .theme-dot[data-t="sunset"] { background: #e67e22; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans Thai', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* ── SETUP BANNER ─────────────────────────────── */
  #setupBanner {
    background: #fffbea;
    border-bottom: 1px solid #e8cc6a;
    padding: 13px 20px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
    color: #6d5a08;
  }
  #setupBanner a { color: var(--primary); font-weight: 600; text-decoration: underline; }
  #setupBanner > button { margin-left: auto; background: none; border: none; cursor: pointer; font-size: 20px; color: #9a8420; flex-shrink: 0; line-height: 1; padding: 2px; }
  .setup-url-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  #urlInput {
    flex: 1; padding: 9px 13px;
    border: 1.5px solid #e0cc70;
    border-radius: var(--radius-xs);
    font-size: 14px;
    font-family: 'Noto Sans Thai', sans-serif;
    background: #fff; outline: none;
    transition: border-color 0.15s;
  }
  #urlInput:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(36,113,163,0.12); }
  .btn-save-url {
    padding: 9px 18px;
    background: var(--primary); color: #fff;
    border: none; border-radius: var(--radius-xs);
    cursor: pointer; font-size: 14px;
    font-family: 'Noto Sans Thai', sans-serif;
    font-weight: 500; white-space: nowrap;
    transition: background 0.15s;
  }
  .btn-save-url:hover { background: var(--primary-light); }

  /* ── LOADER ───────────────────────────────────── */
  #loader {
    position: fixed; inset: 0;
    background: linear-gradient(150deg, var(--header-from) 0%, var(--header-to) 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #loader.hidden { opacity: 0; visibility: hidden; }
  .loader-logo { font-family: 'Noto Serif Thai', serif; color: #fff; font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 6px; letter-spacing: 0.3px; }
  .loader-sub { color: rgba(255,255,255,0.6); font-size: 14px; text-align: center; margin-bottom: 44px; }
  .loader-bar-wrap { width: 200px; height: 3px; background: rgba(255,255,255,0.18); border-radius: 99px; overflow: hidden; }
  .loader-bar { height: 100%; background: #fff; border-radius: 99px; width: 0%; transition: width 0.4s ease; }
  .loader-status { color: rgba(255,255,255,0.45); font-size: 13px; margin-top: 16px; letter-spacing: 0.2px; }

  /* ── HEADER ───────────────────────────────────── */
  header {
    background: linear-gradient(135deg, var(--header-from) 0%, var(--header-to) 100%);
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 3px 20px rgba(0,0,0,0.25);
  }
  .header-top { display: flex; align-items: center; gap: 14px; padding: 16px 18px 12px; }
  .header-emblem {
    width: 46px; height: 46px;
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .header-title { flex: 1; }
  .header-title h1 { font-family: 'Noto Serif Thai', serif; font-size: 18px; font-weight: 600; color: #fff; line-height: 1.25; }
  .header-title p { font-size: 12.5px; color: rgba(255,255,255,0.55); margin-top: 3px; }
  .header-count { text-align: right; flex-shrink: 0; }
  .header-count .num { font-size: 28px; font-weight: 600; color: #fff; line-height: 1; }
  .header-count .lbl { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; letter-spacing: 0.3px; }

  .search-wrap { padding: 0 16px 14px; }
  .search-box {
    display: flex; align-items: center;
    background: rgba(255,255,255,0.11);
    border: 1.5px solid rgba(255,255,255,0.22);
    border-radius: 11px; padding: 0 14px; gap: 10px;
    transition: background 0.2s, border-color 0.2s;
  }
  .search-box:focus-within { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
  #searchInput { flex: 1; background: none; border: none; outline: none; color: #fff; font-family: 'Noto Sans Thai', sans-serif; font-size: 16px; padding: 12px 0; }
  #searchInput::placeholder { color: rgba(255,255,255,0.38); }
  .search-clear { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.45); font-size: 19px; display: none; padding: 4px; line-height: 1; transition: color 0.15s; }
  .search-clear:hover { color: rgba(255,255,255,0.8); }
  .search-clear.visible { display: flex; }

  /* ── FILTER TABS ──────────────────────────────── */
  .filter-wrap {
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    padding: 0 14px;
    display: flex; gap: 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .filter-wrap::-webkit-scrollbar { display: none; }
  .filter-tab {
    padding: 13px 17px;
    font-size: 14px; color: var(--text2);
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    white-space: nowrap;
    font-family: 'Noto Sans Thai', sans-serif;
    background: none;
    border-left: none; border-right: none; border-top: none;
    transition: color 0.15s, border-color 0.15s;
    font-weight: 400;
  }
  .filter-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .filter-tab:hover:not(.active) { color: var(--text); }

  /* ── MAIN ─────────────────────────────────────── */
  main { max-width: 720px; margin: 0 auto; padding: 18px 13px 90px; }

  /* stats */
  .stats-bar { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat-card {
    flex: 1; background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 10px; text-align: center;
    box-shadow: var(--shadow-sm);
  }
  .stat-card .n { font-size: 24px; font-weight: 600; color: var(--primary); line-height: 1.1; }
  .stat-card .l { font-size: 11.5px; color: var(--text2); margin-top: 3px; line-height: 1.3; }

  /* result row */
  .result-info { font-size: 13.5px; color: var(--text2); margin-bottom: 13px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .result-info strong { color: var(--primary); font-weight: 600; }
  .result-actions { display: flex; gap: 8px; align-items: center; }
  .refresh-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-xs);
    color: var(--text2); font-size: 13px;
    cursor: pointer; font-family: 'Noto Sans Thai', sans-serif;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .refresh-btn:hover { background: var(--primary-pale); color: var(--primary); border-color: var(--primary-light); }
  .spinning { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── CARDS ────────────────────────────────────── */
  .cards-list { display: flex; flex-direction: column; gap: 11px; }

  .school-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 17px 16px;
    box-shadow: var(--shadow);
    transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s;
    position: relative; cursor: pointer;
  }
  .school-card:hover {
    border-color: var(--primary-light);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .school-card:active { transform: translateY(0); }

  .card-header { display: flex; align-items: flex-start; gap: 13px; margin-bottom: 11px; }

  .card-avatar {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--primary-pale);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
    color: var(--primary); font-weight: 700;
    border: 2px solid rgba(26,82,118,0.12);
  }
  .card-avatar.female { background: #fde8f2; color: #8b1f50; border-color: rgba(139,31,80,0.12); }
  .card-avatar.other  { background: #e8f5dc; color: #3a6910; border-color: rgba(58,105,16,0.12); }

  .card-info { flex: 1; min-width: 0; }
  .school-name { font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.35; margin-bottom: 4px; }
  .director-name { font-size: 14px; color: var(--text2); display: flex; align-items: baseline; gap: 3px; flex-wrap: wrap; }
  .title-prefix { color: var(--text3); font-size: 13px; }
  .name-part { color: var(--primary-light); font-weight: 600; }

  .card-body {
    display: flex; align-items: center;
    justify-content: space-between;
    gap: 10px; margin-top: 11px; padding-top: 11px;
    border-top: 1.5px solid var(--border);
    flex-wrap: wrap;
  }
  .card-location { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); flex-wrap: wrap; }
  .location-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
  .badge-amphoe {
    display: inline-block;
    background: var(--primary-pale); color: var(--primary);
    font-size: 11.5px; padding: 2px 9px;
    border-radius: 99px; font-weight: 600;
    border: 1px solid rgba(26,82,118,0.15);
  }

  .card-phone { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .phone-number { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: 0.6px; }

  .btn-call {
    display: flex; align-items: center; gap: 5px;
    background: var(--primary); color: #fff;
    border: none; border-radius: var(--radius-sm);
    padding: 8px 14px; font-size: 14px;
    cursor: pointer; text-decoration: none;
    font-family: 'Noto Sans Thai', sans-serif;
    font-weight: 500; white-space: nowrap;
    transition: background 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 8px rgba(26,82,118,0.2);
  }
  .btn-call:hover { background: var(--primary-light); box-shadow: 0 3px 12px rgba(26,82,118,0.28); }

  .btn-copy {
    background: none; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 10px; cursor: pointer;
    font-size: 17px; color: var(--text2);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    display: flex; align-items: center; line-height: 1;
  }
  .btn-copy:hover { background: var(--surface2); color: var(--primary); border-color: var(--primary-light); }
  .btn-copy.copied { color: #1a7a42; border-color: #1a7a42; background: var(--green-pale); }

  .multi-school-badge {
    position: absolute; top: 13px; right: 13px;
    background: #fffbea; border: 1px solid #e8cc6a;
    color: #7d6208; font-size: 10.5px;
    padding: 2px 9px; border-radius: 99px; font-weight: 600;
  }

  .hl { background: #fff0a0; border-radius: 3px; padding: 0 1px; }

  /* saving state */
  .card-saving { opacity: 0.45; pointer-events: none; }

  /* ── EMPTY STATE ──────────────────────────────── */
  .empty-state { text-align: center; padding: 64px 20px; color: var(--text2); }
  .empty-state .icon { font-size: 52px; margin-bottom: 18px; opacity: 0.35; }
  .empty-state h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 14px; }

  /* ── MODAL ────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,0.16), transparent 34%),
      rgba(8,20,35,0.62);
    backdrop-filter: blur(7px) saturate(1.08);
    z-index: 1000; display: flex;
    align-items: center; justify-content: center;
    padding: 16px; opacity: 0; visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }
  .modal {
    position: relative;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.94)),
      var(--surface);
    border: 1px solid rgba(255,255,255,0.72);
    border-radius: 18px;
    padding: 0;
    width: 100%; max-width: 490px;
    max-height: 92vh; overflow-y: auto;
    transform: translateY(18px);
    transition: transform 0.25s;
    box-shadow: 0 26px 80px rgba(5,18,32,0.34), 0 2px 10px rgba(5,18,32,0.12);
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px;
    padding: 22px 24px 18px;
    background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.92));
    border-bottom: 1px solid rgba(213,224,236,0.72);
    backdrop-filter: blur(10px);
  }
  .modal h2 {
    font-size: 18px; font-weight: 700; color: var(--text);
    line-height: 1.3; letter-spacing: 0;
  }
  .modal-close {
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    font-size: 22px; line-height: 1;
    transition: color 0.15s, border-color 0.15s, background 0.15s, transform 0.15s;
    flex-shrink: 0;
  }
  .modal-close:hover {
    color: var(--text);
    border-color: var(--primary-light);
    background: var(--surface2);
    transform: translateY(-1px);
  }
  .modal-close:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(36,113,163,0.18);
  }
  .modal-body { padding: 22px 24px 24px; }

  .form-group { margin-bottom: 17px; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 700;
    color: var(--text2); margin-bottom: 7px;
    letter-spacing: 0;
  }
  .form-group input, .form-group select {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid rgba(213,224,236,0.96);
    border-radius: 10px;
    font-size: 15px; font-family: 'Noto Sans Thai', sans-serif;
    color: var(--text); background: rgba(255,255,255,0.86);
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s; outline: none;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--primary-light);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(36,113,163,0.13);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }

  .modal-footer {
    display: flex; gap: 10px; justify-content: flex-end;
    margin-top: 22px; padding-top: 18px;
    border-top: 1px solid rgba(213,224,236,0.82);
  }
  .btn-secondary {
    padding: 10px 20px; border: 1.5px solid var(--border);
    border-radius: 10px; background: rgba(255,255,255,0.64);
    cursor: pointer; font-size: 15px;
    font-family: 'Noto Sans Thai', sans-serif; color: var(--text2);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-secondary:hover { background: var(--surface2); border-color: var(--primary-light); color: var(--text); }
  .btn-primary {
    padding: 10px 22px; border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff; cursor: pointer; font-size: 15px;
    font-family: 'Noto Sans Thai', sans-serif; font-weight: 600;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    box-shadow: 0 8px 18px rgba(26,82,118,0.22);
  }
  .btn-primary:hover { filter: brightness(1.04); transform: translateY(-1px); box-shadow: 0 10px 22px rgba(26,82,118,0.28); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
  .btn-danger {
    padding: 10px 20px; border: 1.5px solid #d9534f;
    border-radius: 10px; background: rgba(255,255,255,0.64);
    color: #c0392b; cursor: pointer; font-size: 15px;
    font-family: 'Noto Sans Thai', sans-serif;
    margin-right: auto; transition: background 0.15s;
  }
  .btn-danger:hover { background: #fdf0ee; }
  .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── FAB ──────────────────────────────────────── */
  .fab {
    position: fixed; bottom: 24px; right: 20px;
    width: 54px; height: 54px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 50%;
    font-size: 22px; cursor: pointer;
    box-shadow: 0 4px 18px rgba(176,58,46,0.38);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    z-index: 500;
  }

<script>
// ====================================================
// CONFIG — แก้ URL นี้หลัง deploy Apps Script แล้ว
// หรือใส่ผ่าน UI แล้วกด "บันทึก URL"
// ====================================================
const SCRIPT_URL_KEY = 'sppms2_script_url';
const CACHE_KEY = 'sppms2_data_v3';
const CACHE_TS_KEY = 'sppms2_ts_v3';
const CACHE_TTL = 30 * 60 * 1000; // 30 นาที

let allData = [];
let filteredData = [];
let currentAmphoe = '';
let currentQuery = '';
let editingRowIndex = -1;
let fabOpen = false;
let multiDirectors = new Set();
let isSaving = false;

function getScriptUrl() {
  return localStorage.getItem(SCRIPT_URL_KEY) || '';
}

function saveScriptUrl() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url.startsWith('https://script.google.com')) {
    showToast('URL ไม่ถูกต้อง ต้องเริ่มด้วย https://script.google.com', 'error'); return;
  }
  localStorage.setItem(SCRIPT_URL_KEY, url);
  document.getElementById('setupBanner').style.display = 'none';
  showToast('บันทึก URL แล้ว กำลังโหลดข้อมูล...', 'success');
  localStorage.removeItem(CACHE_KEY);
  init();
}

function showSetupBanner() {
  const b = document.getElementById('setupBanner');
  b.style.display = 'flex';
  document.getElementById('urlInput').value = getScriptUrl();
  toggleFab();
}

// ====================================================
// DATA LAYER
// ====================================================
function normalizePhone(p) {
  if (!p) return '';
  return String(p).replace(/[\u200b\u200c\u200d\ufeff​]/g,'').replace(/[^\d\s]/g,'').trim();
}

function stripTitle(name) {
  if (!name) return { prefix: '', clean: '' };
  const prefixes = ['นางสาว','นาง','นาย','ว่าที่ ร.ต.','ว่าที่ร.ต.','ดร.'];
  let raw = String(name).trim();
  for (const p of prefixes) {
    if (raw.startsWith(p)) return { prefix: p, clean: raw.slice(p.length).trim() };
  }
  return { prefix: '', clean: raw };
}

function getGender(name) {
  if (!name) return 'other';
  if (String(name).startsWith('นางสาว') || String(name).startsWith('นาง')) return 'female';
  if (String(name).startsWith('นาย')) return 'male';
  return 'other';
}

function getInitials(name) {
  if (!name) return '—';
  const { clean } = stripTitle(name);
  const parts = clean.split(/\s+/).filter(Boolean);
  return parts[0]?.charAt(0) + (parts[1]?.charAt(0) || '');
}

function computeMultiDirectors(data) {
  const cnt = {};
  data.forEach(d => { if (d.director) cnt[d.director] = (cnt[d.director] || 0) + 1; });
  multiDirectors = new Set(Object.entries(cnt).filter(([,v]) => v > 1).map(([k]) => k));
}

async function apiFetch(params) {
  const url = getScriptUrl();
  if (!url) throw new Error('ยังไม่ได้ตั้งค่า Script URL');
  const res = await fetch(url + '?' + new URLSearchParams(params));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

async function apiPost(body) {
  // ใช้ GET แทน POST เพื่อหลีกเลี่ยง CORS preflight ที่ Apps Script ไม่รองรับ
  const url = getScriptUrl();
  if (!url) throw new Error('ยังไม่ได้ตั้งค่า Script URL');
  const params = new URLSearchParams({
    action: body.action,
    rowIndex: body.rowIndex ?? '',
    data: JSON.stringify(body.data ?? {}),
  });
  const res = await fetch(url + '?' + params);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

function saveCache(data) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    localStorage.setItem(CACHE_TS_KEY, Date.now().toString());
  } catch(e) {}
}

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    const ts = localStorage.getItem(CACHE_TS_KEY);
    if (raw && ts && (Date.now() - parseInt(ts)) < CACHE_TTL) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function setProgress(pct, msg) {
  document.getElementById('loaderBar').style.width = pct + '%';
  if (msg) document.getElementById('loaderStatus').textContent = msg;
}

async function init() {
  setProgress(5, 'กำลังเริ่มต้น...');
  const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbzQBD725osvExNQADQtRg4Jy2ar8fKRCeQPYESXJxmvr2Ang6YL9X8TdOl9LR7F4tE/exec';
  const storedUrl = localStorage.getItem(SCRIPT_URL_KEY) || '';
  if (storedUrl !== DEFAULT_URL) {
    localStorage.setItem(SCRIPT_URL_KEY, DEFAULT_URL);
  }
  document.getElementById('loader').classList.remove('hidden');

  const scriptUrl = getScriptUrl();
  if (!scriptUrl) {
    setProgress(100, 'ยังไม่ได้ตั้งค่า Script URL');
    document.getElementById('setupBanner').style.display = 'flex';
    document.getElementById('urlInput').value = '';
    setTimeout(() => document.getElementById('loader').classList.add('hidden'), 600);
    return;
  }

  // ลอง cache ก่อน
  const cached = loadCache();
  if (cached && cached.length > 0) {
    setProgress(60, 'ใช้ข้อมูลแคช...');
    allData = cached;
    computeMultiDirectors(allData);
    finishLoad();
    // โหลดใหม่ background
    fetchAndUpdate(true);
    return;
  }

  await fetchAndUpdate(false);
}

async function fetchAndUpdate(silent) {
  if (!silent) setProgress(20, 'กำลังดึงข้อมูลจาก Google Sheets...');
  try {
    const json = await apiFetch({ action: 'list' });
    allData = json.records || [];
    computeMultiDirectors(allData);
    saveCache(allData);
    if (!silent) {
      setProgress(95, 'โหลดสำเร็จ');
      finishLoad();
    } else {
      updateStats();
      applyFilter();
    }
  } catch(e) {
    if (!silent) {
      const cached = loadCache();
      if (cached && cached.length > 0) {
        allData = cached;
        computeMultiDirectors(allData);
        finishLoad();
        showToast('ใช้ข้อมูลแคช (เชื่อมต่อไม่ได้)', 'error');
      } else {
        setProgress(100, 'เกิดข้อผิดพลาด: ' + e.message);
        document.getElementById('loaderStatus').style.color = '#e74c3c';
      }
    } else {
      showToast('รีเฟรชล้มเหลว: ' + e.message, 'error');
    }
  }
}

function finishLoad() {
  updateStats();
  applyFilter();
  setProgress(100, 'พร้อมใช้งาน');
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('resultInfo').style.display = 'flex';
  document.getElementById('headerCount').textContent = allData.length;
  setTimeout(() => document.getElementById('loader').classList.add('hidden'), 400);
}

async function refreshData() {
  const icon = document.getElementById('refreshIcon');
  icon.classList.add('spinning');
  try {
    const json = await apiFetch({ action: 'list' });
    allData = json.records || [];
    computeMultiDirectors(allData);
    saveCache(allData);
    updateStats();
    applyFilter();
    showToast('อัปเดตข้อมูลเรียบร้อย ✓', 'success');
  } catch(e) {
    showToast('รีเฟรชล้มเหลว: ' + e.message, 'error');
  }
  icon.classList.remove('spinning');
}

// ====================================================
// SEARCH & FILTER
// ====================================================
function normalize(s) {
  return String(s || '').replace(/[\s\u200b\u200c\u200d]/g,'').toLowerCase();
}

function applyFilter() {
  const q = normalize(currentQuery);
  filteredData = allData.filter(d => {
    if (currentAmphoe && d.amphoe !== currentAmphoe) return false;
    if (!q) return true;
    const { clean } = stripTitle(d.director);
    return (
      normalize(d.school).includes(q) ||
      normalize(d.director).includes(q) ||
      normalize(clean).includes(q) ||
      normalize(d.tambon).includes(q) ||
      normalize(d.amphoe).includes(q) ||
      normalize(d.phone).includes(q)
    );
  });
  renderCards();
  const q2 = currentQuery.trim();
  document.getElementById('resultText').innerHTML = q2
    ? `พบ <strong>${filteredData.length}</strong> รายการ จากคำค้น "<strong>${escHtml(q2)}</strong>"`
    : `แสดง <strong>${filteredData.length}</strong> รายการ`;
}

function filterAmphoe(amphoe) {
  currentAmphoe = amphoe;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(amphoe ? 'tab-' + amphoe : 'tab-all').classList.add('active');
  applyFilter();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  currentQuery = '';
  document.getElementById('searchClear').classList.remove('visible');
  applyFilter();
}

document.getElementById('searchInput').addEventListener('input', function() {
  currentQuery = this.value;
  document.getElementById('searchClear').classList.toggle('visible', this.value.length > 0);
  applyFilter();
});

function updateStats() {
  document.getElementById('statTotal').textContent = allData.length;
  const dirs = new Set(allData.map(d => d.director).filter(Boolean));
  document.getElementById('statDirectors').textContent = dirs.size;
  document.getElementById('statMulti').textContent = multiDirectors.size;
  document.getElementById('headerCount').textContent = allData.length;
  document.getElementById('tab-all').textContent = `ทั้งหมด (${allData.length})`;
  ['แม่สะเรียง','สบเมย','แม่ลาน้อย'].forEach(a => {
    const el = document.getElementById('tab-' + a);
    if (el) el.textContent = `อ.${a} (${allData.filter(d=>d.amphoe===a).length})`;
  });
}

// ====================================================
// RENDER
// ====================================================
function highlight(text, query) {
  if (!query || !text) return escHtml(text || '');
  const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return escHtml(text).replace(re, m => `<span class="hl">${m}</span>`);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCards() {
  const list = document.getElementById('cardsList');
  if (filteredData.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>ไม่พบข้อมูล</h3><p>ลองค้นหาด้วยคำอื่น</p></div>`;
    return;
  }
  const q = currentQuery.trim();
  list.innerHTML = filteredData.map((d, i) => {
    const gender = getGender(d.director);
    const initials = getInitials(d.director);
    const { prefix, clean } = stripTitle(d.director);
    const isMulti = multiDirectors.has(d.director);
    const phoneClean = (d.phone || '').replace(/\s/g,'');
    return `
      <div class="school-card" id="card-${i}" onclick="openEditModal(${JSON.stringify(d.rowIndex)})">
        ${isMulti ? '<span class="multi-school-badge">ดูแลหลายโรงเรียน</span>' : ''}
        <div class="card-header">
          <div class="card-avatar ${gender}">${escHtml(initials)}</div>
          <div class="card-info">
            <div class="school-name">${highlight(d.school, q)}</div>
            <div class="director-name">
              ${prefix ? `<span class="title-prefix">${escHtml(prefix)}</span> ` : ''}
              <span class="name-part">${highlight(clean, q)}</span>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="card-location">
            <span>${highlight(d.tambon, q)}</span>
            ${d.tambon ? '<span class="location-dot"></span>' : ''}
            <span class="badge-amphoe">${highlight(d.amphoe, q)}</span>
          </div>
          <div class="card-phone">
            <span class="phone-number">${highlight(d.phone, q)}</span>
            <button class="btn-copy" id="copy-${i}" onclick="copyPhone(event,'${escHtml(phoneClean)}',${i})" title="คัดลอก">⎘</button>
            <a class="btn-call" href="tel:${escHtml(phoneClean)}" onclick="event.stopPropagation()">📞 โทร</a>
          </div>
        </div>
      </div>`;
  }).join('');
}

function copyPhone(e, phone, idx) {
  e.stopPropagation();
  navigator.clipboard.writeText(phone).then(() => {
    const btn = document.getElementById('copy-' + idx);
    if (btn) { btn.classList.add('copied'); btn.textContent = '✓'; }
    showToast('คัดลอก: ' + phone, 'success');
    setTimeout(() => { if (btn) { btn.classList.remove('copied'); btn.textContent = '⎘'; } }, 2000);
  }).catch(() => showToast('คัดลอกไม่ได้', 'error'));
}

// ====================================================
// MODAL — CRUD
// ====================================================
function openAddModal() {
  editingRowIndex = -1;
  document.getElementById('modalTitle').textContent = 'เพิ่มโรงเรียนใหม่';
  ['fSchool','fDirector','fTambon','fPhone'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fAmphoe').value = 'แม่สะเรียง';
  document.getElementById('btnDelete').style.display = 'none';
  document.getElementById('modalError').style.display = 'none';
  document.getElementById('modalOverlay').classList.add('open');
  toggleFab();
  setTimeout(() => document.getElementById('fSchool').focus(), 100);
}

function openEditModal(rowIndex) {
  const d = allData.find(r => r.rowIndex === rowIndex);
  if (!d) return;
  editingRowIndex = rowIndex;
  document.getElementById('modalTitle').textContent = 'แก้ไขข้อมูล';
  document.getElementById('fSchool').value = d.school;
  document.getElementById('fDirector').value = d.director;
  document.getElementById('fTambon').value = d.tambon;
  document.getElementById('fAmphoe').value = d.amphoe;
  document.getElementById('fPhone').value = d.phone;
  document.getElementById('btnDelete').style.display = 'block';
  document.getElementById('modalError').style.display = 'none';
  // แสดง copy-from panel เฉพาะตอน edit
  document.getElementById('copyFromWrap').style.display = 'block';
  // reset state
  const toggle = document.getElementById('copyFromToggle');
  const body = document.getElementById('copyFromBody');
  toggle.classList.remove('open');
  body.classList.remove('open');
  document.getElementById('copyFromSearch').value = '';
  document.getElementById('modalOverlay').classList.add('open');
}

function toggleCopyFrom() {
  const toggle = document.getElementById('copyFromToggle');
  const body = document.getElementById('copyFromBody');
  const isOpen = body.classList.contains('open');
  toggle.classList.toggle('open', !isOpen);
  body.classList.toggle('open', !isOpen);
  if (!isOpen) {
    renderCopyFromList();
    setTimeout(() => document.getElementById('copyFromSearch').focus(), 80);
  }
}

function renderCopyFromList() {
  const q = document.getElementById('copyFromSearch').value.trim().toLowerCase();
  const currentSchool = document.getElementById('fSchool').value.trim();
  // กรอง: ไม่แสดงโรงเรียนตัวเอง, และต้องมี director+phone
  const candidates = allData.filter(d => {
    if (d.school === currentSchool) return false;
    if (!d.director && !d.phone) return false;
    if (!q) return true;
    return (
      d.school.toLowerCase().includes(q) ||
      d.director.toLowerCase().includes(q)
    );
  });

  const list = document.getElementById('copyFromList');
  if (candidates.length === 0) {
    list.innerHTML = `<div class="copyfrom-empty">ไม่พบโรงเรียนที่ตรงกับคำค้น</div>`;
    return;
  }
  list.innerHTML = candidates.slice(0, 30).map(d => `
    <div class="copyfrom-item" onclick="applyDirectorFrom(${d.rowIndex})">
      <span class="ci-school">🏫 ${escHtml(d.school)}</span>
      <span class="ci-director">👤 ${escHtml(d.director || '—')}</span>
      <span class="ci-phone">📞 ${escHtml(d.phone || '—')}</span>
    </div>
  `).join('');
}

function applyDirectorFrom(rowIndex) {
  const src = allData.find(r => r.rowIndex === rowIndex);
  if (!src) return;
  document.getElementById('fDirector').value = src.director;
  document.getElementById('fPhone').value = src.phone;
  // ปิด panel
  document.getElementById('copyFromToggle').classList.remove('open');
  document.getElementById('copyFromBody').classList.remove('open');
  document.getElementById('copyFromSearch').value = '';
  showToast(`นำเข้าข้อมูล ผอ. จาก "${src.school}" แล้ว`, 'success');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('copyFromWrap').style.display = 'none';
  document.getElementById('copyFromToggle').classList.remove('open');
  document.getElementById('copyFromBody').classList.remove('open');
}

function setModalBusy(busy) {
  isSaving = busy;
  document.getElementById('btnSave').disabled = busy;
  document.getElementById('btnDelete').disabled = busy;
  document.getElementById('btnSave').textContent = busy ? 'กำลังบันทึก...' : 'บันทึก';
}

function showModalError(msg) {
  const el = document.getElementById('modalError');
  el.textContent = msg;
  el.style.display = 'block';
}

async function saveRecord() {
  if (isSaving) return;
  const school = document.getElementById('fSchool').value.trim();
  const phone = normalizePhone(document.getElementById('fPhone').value);
  if (!school) { document.getElementById('fSchool').focus(); showModalError('กรุณาระบุชื่อโรงเรียน'); return; }
  if (!phone) { document.getElementById('fPhone').focus(); showModalError('กรุณาระบุเบอร์โทรศัพท์'); return; }
  document.getElementById('modalError').style.display = 'none';

  const data = {
    school,
    director: document.getElementById('fDirector').value.trim(),
    tambon: document.getElementById('fTambon').value.trim(),
    amphoe: document.getElementById('fAmphoe').value,
    phone,
  };

  setModalBusy(true);
  try {
    if (editingRowIndex < 0) {
      await apiPost({ action: 'add', data });
      showToast('เพิ่มข้อมูลเรียบร้อย ✓', 'success');
    } else {
      await apiPost({ action: 'update', rowIndex: editingRowIndex, data });
      showToast('อัปเดตข้อมูลเรียบร้อย ✓', 'success');
    }
    closeModal();
    // รีเฟรชข้อมูลจาก sheet จริง
    localStorage.removeItem(CACHE_KEY);
    await refreshData();
  } catch(e) {
    showModalError('เกิดข้อผิดพลาด: ' + e.message);
  }
  setModalBusy(false);
}

async function deleteRecord() {
  if (isSaving || editingRowIndex < 0) return;
  const d = allData.find(r => r.rowIndex === editingRowIndex);
  if (!confirm(`ลบ "${d?.school || ''}" ออกจากฐานข้อมูล?\n\nการกระทำนี้ไม่สามารถย้อนกลับได้`)) return;
  setModalBusy(true);
  try {
    await apiPost({ action: 'delete', rowIndex: editingRowIndex });
    showToast('ลบข้อมูลเรียบร้อย', 'success');
    closeModal();
    localStorage.removeItem(CACHE_KEY);
    await refreshData();
  } catch(e) {
    showModalError('เกิดข้อผิดพลาด: ' + e.message);
  }
  setModalBusy(false);
}

// ====================================================
// FAB & TOAST & KEYBOARD
// ====================================================
function toggleFab() {
  fabOpen = !fabOpen;
  document.getElementById('fabGroup').classList.toggle('open', fabOpen);
  document.getElementById('fabBtn').style.background = fabOpen ? 'var(--primary)' : '';
}

function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('sppms2_theme', t);
  document.querySelectorAll('.theme-dot').forEach(d => {
    d.classList.toggle('active', d.dataset.t === t);
  });
}

function initTheme() {
  const saved = localStorage.getItem('sppms2_theme') || 'navy';
  setTheme(saved);
}

let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 2800);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && fabOpen) toggleFab();
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

initTheme();
init();
</script>
