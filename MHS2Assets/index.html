<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบทะเบียนครุภัณฑ์ สพป.มส.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a5276'/><text y='.9em' font-size='62' x='50%' text-anchor='middle'>📋</text></svg>">
<style>
:root {
  --primary:#1a5276;--primary-light:#2471a3;--primary-pale:#dbeaf8;
  --header-from:#0b2034;--header-to:#1a5276;
  --accent:#b03a2e;--accent-light:#e74c3c;
  --green:#1a7a42;--green-pale:#d0f0e0;
  --orange:#d35400;--orange-pale:#fde8d8;
  --bg:#eef1f7;--surface:#fff;--surface2:#f2f5fb;
  --text:#17202a;--text2:#566573;--text3:#a9b9c8;--border:#d5e0ec;
  --shadow-sm:0 1px 4px rgba(26,82,118,.07);
  --shadow:0 2px 14px rgba(26,82,118,.09);
  --shadow-md:0 6px 24px rgba(26,82,118,.13);
  --radius:14px;--radius-sm:9px;--radius-xs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}

/* ── LOADER ── */
#loader{position:fixed;inset:0;background:linear-gradient(150deg,var(--header-from),var(--header-to));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s,visibility .5s}
#loader.hidden{opacity:0;visibility:hidden}
.loader-logo{font-family:'Noto Serif Thai',serif;color:#fff;font-size:22px;font-weight:600;text-align:center;margin-bottom:6px}
.loader-sub{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:40px}
.loader-bar-wrap{width:200px;height:3px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.loader-bar{height:100%;background:#fff;border-radius:99px;width:0%;transition:width .4s}
.loader-status{color:rgba(255,255,255,.45);font-size:12px;margin-top:14px}

/* ── LOGIN ── */
#loginScreen{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#0b2034 0%,#1a5276 55%,#1f618d 100%);
  display:flex;align-items:center;justify-content:center;z-index:8000;padding:20px;
  transition:opacity .4s,visibility .4s;
}
#loginScreen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 70% 30%, rgba(36,113,163,.35) 0%, transparent 60%),
             radial-gradient(ellipse at 20% 80%, rgba(26,82,118,.4) 0%, transparent 55%);
  pointer-events:none;
}
#loginScreen.hidden{opacity:0;visibility:hidden}
.login-box{
  background:rgba(255,255,255,.97);
  border-radius:20px;
  padding:44px 40px;
  width:100%;max-width:400px;
  box-shadow:0 32px 80px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.15);
  position:relative;
  backdrop-filter:blur(12px);
}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .icon{
  font-size:48px;display:block;margin-bottom:12px;
  filter:drop-shadow(0 4px 12px rgba(26,82,118,.25));
}
.login-logo h1{
  font-family:'Noto Serif Thai',serif;font-size:20px;font-weight:700;
  color:var(--text);line-height:1.3;
}
.login-logo p{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5}
.login-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:4px 0 28px}
.login-field{margin-bottom:18px;position:relative}
.login-field label{
  display:block;font-size:11px;font-weight:700;color:var(--text2);
  margin-bottom:7px;text-transform:uppercase;letter-spacing:.8px;
}
.login-field input{
  width:100%;padding:13px 16px;
  border:1.5px solid var(--border);border-radius:10px;
  font-size:15px;font-family:'Noto Sans Thai',sans-serif;color:var(--text);
  outline:none;transition:border-color .2s,box-shadow .2s,background .2s;
  background:#fafcff;
}
.login-field input:focus{
  border-color:var(--primary-light);
  box-shadow:0 0 0 4px rgba(36,113,163,.12);
  background:#fff;
}
.login-err{
  color:#c0392b;font-size:13px;margin-bottom:14px;display:none;
  text-align:center;background:#fdf0ee;padding:9px 14px;
  border-radius:8px;border:1px solid rgba(192,57,43,.15);
}
.btn-login{
  width:100%;padding:14px;
  background:linear-gradient(135deg,var(--primary-light),var(--primary));
  color:#fff;border:none;border-radius:10px;
  font-size:16px;font-family:'Noto Sans Thai',sans-serif;font-weight:600;
  cursor:pointer;transition:all .2s;
  box-shadow:0 4px 16px rgba(26,82,118,.35);
  letter-spacing:.3px;
}
.btn-login:hover{
  background:linear-gradient(135deg,#2e86c1,var(--primary-light));
  box-shadow:0 6px 20px rgba(26,82,118,.45);
  transform:translateY(-1px);
}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* ── HEADER ── */
header{
  background:linear-gradient(135deg,var(--header-from) 0%,#1a4f6e 60%,var(--header-to) 100%);
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px rgba(0,0,0,.25);
}
.header-top{display:flex;align-items:center;gap:14px;padding:12px 24px 10px}
.header-emblem{
  width:44px;height:44px;
  background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.2);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.header-title{flex:1}
.header-title h1{
  font-family:'Noto Serif Thai',serif;font-size:17px;font-weight:700;
  color:#fff;line-height:1.25;letter-spacing:.2px;
}
.header-title p{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.header-user{display:flex;align-items:center;gap:10px;flex-shrink:0}
.header-user-avatar{
  width:32px;height:32px;background:rgba(255,255,255,.18);
  border:1.5px solid rgba(255,255,255,.25);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.header-user-name{font-size:12.5px;color:rgba(255,255,255,.75);font-weight:500}
.btn-logout{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.85);border-radius:8px;padding:6px 14px;
  font-size:12px;cursor:pointer;font-family:'Noto Sans Thai',sans-serif;
  transition:all .15s;font-weight:500;
}
.btn-logout:hover{background:rgba(255,255,255,.2);color:#fff}

/* SEARCH */
.search-wrap{padding:0 24px 12px}
.search-box{
  display:flex;align-items:center;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);
  border-radius:12px;padding:0 16px;gap:10px;
  transition:all .2s;max-width:100%;
}
.search-box:focus-within{
  background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45);
  box-shadow:0 0 0 3px rgba(255,255,255,.08);
}
.search-icon{color:rgba(255,255,255,.5);font-size:16px;flex-shrink:0}
#searchInput{
  flex:1;background:none;border:none;outline:none;color:#fff;
  font-family:'Noto Sans Thai',sans-serif;font-size:14.5px;padding:11px 0;
}
#searchInput::placeholder{color:rgba(255,255,255,.35)}
.search-clear{
  background:none;border:none;cursor:pointer;color:rgba(255,255,255,.4);
  font-size:16px;display:none;padding:4px;line-height:1;transition:color .15s;
}
.search-clear:hover{color:rgba(255,255,255,.8)}
.search-clear.visible{display:flex}

/* ── TABS ── */
.tabs-wrap{
  background:var(--surface);
  border-bottom:1.5px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;
  padding:0 20px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.tabs-wrap::-webkit-scrollbar{display:none}
.tab-btn{
  padding:12px 16px;font-size:13px;color:var(--text2);cursor:pointer;
  border:none;border-bottom:2.5px solid transparent;white-space:nowrap;
  font-family:'Noto Sans Thai',sans-serif;background:none;
  transition:all .18s;font-weight:400;flex-shrink:0;
  position:relative;
}
.tab-btn::after{
  content:'';position:absolute;bottom:-1.5px;left:0;right:0;height:2.5px;
  background:var(--primary);border-radius:2px 2px 0 0;
  transform:scaleX(0);transition:transform .2s;
}
.tab-btn.active{color:var(--primary);font-weight:600}
.tab-btn.active::after{transform:scaleX(1)}
.tab-btn:hover:not(.active){color:var(--text);background:var(--surface2)}
.tab-btn.tab-summary{color:var(--green)}
.tab-btn.tab-summary::after{background:var(--green)}
.tab-btn.tab-summary.active{color:var(--green)}
.tab-btn.tab-dispose{color:var(--orange)}
.tab-btn.tab-dispose::after{background:var(--orange)}
.tab-btn.tab-dispose.active{color:var(--orange)}

/* ── MAIN ── */
main{width:100%;padding:20px 24px 100px}

/* ── STATS ── */
.stats-bar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.stat-card{
  flex:1;min-width:120px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:12px;padding:16px 14px;text-align:center;
  box-shadow:var(--shadow-sm);
  transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--primary);border-radius:12px 12px 0 0;
}
.stat-card.green::before{background:var(--green)}
.stat-card.orange::before{background:var(--orange)}
.stat-card.red::before{background:var(--accent)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card .n{font-size:26px;font-weight:700;color:var(--primary);line-height:1.1}
.stat-card .l{font-size:11.5px;color:var(--text2);margin-top:4px;font-weight:500}
.stat-card.green .n{color:var(--green)}
.stat-card.orange .n{color:var(--orange)}
.stat-card.red .n{color:var(--accent)}

/* ── TOOLBAR ── */
.toolbar{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;margin-bottom:16px;
}
.toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.result-text{font-size:13px;color:var(--text2)}
.result-text strong{color:var(--primary);font-weight:600}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:8px;
  font-size:13px;font-family:'Noto Sans Thai',sans-serif;
  cursor:pointer;border:1.5px solid transparent;
  transition:all .18s;white-space:nowrap;font-weight:500;
}
.btn-primary{
  background:linear-gradient(135deg,var(--primary-light),var(--primary));
  color:#fff;border-color:var(--primary);
  box-shadow:0 2px 8px rgba(26,82,118,.25);
}
.btn-primary:hover{
  background:linear-gradient(135deg,#2e86c1,var(--primary-light));
  box-shadow:0 4px 14px rgba(26,82,118,.35);
  transform:translateY(-1px);
}
.btn-outline{
  background:var(--surface);color:var(--text2);border-color:var(--border);
}
.btn-outline:hover{
  background:var(--primary-pale);color:var(--primary);border-color:var(--primary-light);
}
.btn-green{
  background:linear-gradient(135deg,#1f9150,var(--green));
  color:#fff;border-color:var(--green);
  box-shadow:0 2px 8px rgba(26,122,66,.2);
}
.btn-green:hover{box-shadow:0 4px 14px rgba(26,122,66,.3);transform:translateY(-1px)}
.btn-orange{
  background:linear-gradient(135deg,#e67e22,var(--orange));
  color:#fff;border-color:var(--orange);
  box-shadow:0 2px 8px rgba(211,84,0,.2);
}
.btn-orange:hover{box-shadow:0 4px 14px rgba(211,84,0,.3);transform:translateY(-1px)}
.btn-danger-outline{background:none;color:var(--accent);border-color:var(--accent-light)}
.btn-danger-outline:hover{background:#fdf0ee}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none !important;box-shadow:none !important}

/* ── TABLE ── */
.table-wrap{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:14px;overflow:hidden;
  box-shadow:0 2px 16px rgba(26,82,118,.08);
}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:linear-gradient(135deg,#0d253a,#1a5276)}
thead th{
  padding:11px 14px;text-align:left;color:rgba(255,255,255,.9);
  font-weight:600;font-size:11.5px;white-space:nowrap;
  border-right:1px solid rgba(255,255,255,.08);letter-spacing:.3px;
}
thead th:last-child{border-right:none}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#f4f8fc}
tbody tr:nth-child(even){background:#fafcfe}
tbody tr:nth-child(even):hover{background:#f0f6fb}
tbody td{padding:10px 14px;vertical-align:middle;color:var(--text)}
.td-no{color:var(--text3);font-size:12px;text-align:center;width:44px}
.td-actions{text-align:center;white-space:nowrap}
.td-price{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;color:var(--primary)}
.td-code{font-family:monospace;font-size:12px;color:var(--primary);background:var(--primary-pale);padding:2px 6px;border-radius:4px;white-space:nowrap}
.td-status{white-space:nowrap}

/* BADGES */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;
  white-space:nowrap;letter-spacing:.2px;
}
.badge-ok{background:var(--green-pale);color:var(--green);border:1px solid rgba(26,122,66,.2)}
.badge-broken{background:#fde8d8;color:#b03a2e;border:1px solid rgba(176,58,46,.2)}
.badge-worn{background:#fdf5cc;color:#7d6208;border:1px solid rgba(125,98,8,.2)}
.badge-lost{background:#f5eef8;color:#6c3483;border:1px solid rgba(108,52,131,.2)}
.badge-pending{background:#fff3cd;color:#856404;border:1px solid rgba(133,100,4,.25)}
.badge-done{background:var(--green-pale);color:var(--green);border:1px solid rgba(26,122,66,.2)}

/* ACTION BUTTONS IN TABLE */
.btn-icon{
  background:none;border:1.5px solid var(--border);border-radius:7px;
  padding:5px 9px;cursor:pointer;font-size:13px;line-height:1;
  transition:all .15s;color:var(--text2);
}
.btn-icon:hover{background:var(--primary-pale);border-color:var(--primary-light);color:var(--primary);transform:scale(1.05)}
.btn-icon.danger:hover{background:#fdf0ee;border-color:var(--accent-light);color:var(--accent)}
.btn-confirm{
  background:linear-gradient(135deg,#e67e22,var(--orange));
  color:#fff;border:none;border-radius:7px;
  padding:6px 13px;font-size:12px;font-family:'Noto Sans Thai',sans-serif;
  font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;
  box-shadow:0 2px 6px rgba(211,84,0,.25);
}
.btn-confirm:hover{box-shadow:0 4px 12px rgba(211,84,0,.35);transform:translateY(-1px)}

.empty-state{text-align:center;padding:64px 20px;color:var(--text2)}
.empty-state .icon{font-size:52px;opacity:.25;margin-bottom:16px}
.empty-state h3{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty-state p{font-size:13px;color:var(--text3)}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(8,20,35,.6);backdrop-filter:blur(4px);
  z-index:2000;display:flex;align-items:center;justify-content:center;
  padding:16px;opacity:0;visibility:hidden;
  transition:opacity .25s,visibility .25s;
}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{
  background:var(--surface);border-radius:16px;padding:28px 26px;
  width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  transform:translateY(20px) scale(.98);
  transition:transform .25s;
  box-shadow:0 24px 64px rgba(0,0,0,.24),0 0 0 1px rgba(0,0,0,.06);
}
.modal-overlay.open .modal{transform:translateY(0) scale(1)}
.modal-lg{max-width:880px}
.modal h2{
  font-size:18px;font-weight:700;margin-bottom:22px;color:var(--text);
  display:flex;align-items:center;gap:9px;
  padding-bottom:16px;border-bottom:1.5px solid var(--border);
}
.modal-footer{
  display:flex;gap:10px;justify-content:flex-end;
  margin-top:22px;padding-top:18px;border-top:1.5px solid var(--border);
  flex-wrap:wrap;
}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{
  font-size:11px;font-weight:700;color:var(--text2);
  text-transform:uppercase;letter-spacing:.7px;
}
.form-group input,.form-group select{
  padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;font-family:'Noto Sans Thai',sans-serif;color:var(--text);
  background:var(--surface);outline:none;transition:all .18s;
}
.form-group input:focus,.form-group select:focus{
  border-color:var(--primary-light);
  box-shadow:0 0 0 3px rgba(36,113,163,.12);
  background:#fafeff;
}
.form-group input:disabled{background:var(--surface2);color:var(--text3);cursor:not-allowed}
.form-err{
  color:var(--accent-light);font-size:12.5px;display:none;
  background:#fdf0ee;padding:9px 13px;border-radius:7px;
  border-left:3px solid var(--accent-light);
}

/* BUNDLE */
.bundle-toggle{
  display:flex;align-items:center;gap:10px;padding:12px 15px;
  background:linear-gradient(135deg,#dbeaf8,#eaf2fb);
  border-radius:9px;margin-bottom:16px;cursor:pointer;
  user-select:none;border:1.5px solid rgba(26,82,118,.15);
}
.bundle-toggle input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
.bundle-toggle span{font-size:14px;font-weight:600;color:var(--primary)}
.bundle-section{
  background:var(--surface2);border:1.5px dashed var(--border);
  border-radius:9px;padding:16px;margin-top:12px;display:none;
}
.bundle-section.open{display:block}
.bundle-section h4{
  font-size:12px;font-weight:700;color:var(--text2);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;
}

/* MULTI-ROW */
.multi-rows{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.multi-row{
  background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;padding:16px;position:relative;
  transition:border-color .15s;
}
.multi-row:focus-within{border-color:var(--primary-pale)}
.multi-row-num{
  font-size:11px;font-weight:700;color:var(--primary);margin-bottom:12px;
  text-transform:uppercase;letter-spacing:.5px;
}
.multi-row .remove-row{
  position:absolute;top:12px;right:12px;background:none;border:none;
  cursor:pointer;font-size:15px;color:var(--text3);line-height:1;padding:4px;
  border-radius:5px;transition:all .15s;
}
.multi-row .remove-row:hover{color:var(--accent);background:#fdf0ee}
.add-row-bar{display:flex;align-items:center;gap:10px;padding:10px 0}
.add-row-bar input[type=number]{
  width:72px;padding:8px 10px;border:1.5px solid var(--border);
  border-radius:7px;font-size:13px;font-family:'Noto Sans Thai',sans-serif;outline:none;
}
.add-row-bar input:focus{border-color:var(--primary-light)}

/* ── FAB ── */
.fab{
  position:fixed;bottom:28px;right:24px;width:54px;height:54px;
  background:linear-gradient(135deg,#c0392b,var(--accent));
  color:#fff;border:none;border-radius:50%;font-size:22px;cursor:pointer;
  box-shadow:0 6px 20px rgba(176,58,46,.45);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;z-index:500;
}
.fab:hover{
  background:linear-gradient(135deg,var(--accent-light),#c0392b);
  transform:scale(1.08);
  box-shadow:0 8px 26px rgba(176,58,46,.55);
}
.fab-group{
  position:fixed;bottom:94px;right:24px;
  display:flex;flex-direction:column;gap:10px;align-items:flex-end;
  z-index:499;opacity:0;visibility:hidden;transform:translateY(16px);
  transition:opacity .2s,visibility .2s,transform .2s;
}
.fab-group.open{opacity:1;visibility:visible;transform:translateY(0)}
.fab-mini{display:flex;align-items:center;gap:10px}
.fab-mini-label{
  background:rgba(8,20,35,.85);color:#fff;font-size:12px;
  padding:7px 13px;border-radius:8px;white-space:nowrap;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}
.fab-mini-btn{
  width:44px;height:44px;
  background:linear-gradient(135deg,var(--primary-light),var(--primary));
  color:#fff;border:none;border-radius:50%;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(26,82,118,.35);
  transition:all .15s;flex-shrink:0;
}
.fab-mini-btn:hover{transform:scale(1.08);box-shadow:0 5px 16px rgba(26,82,118,.45)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:100px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:#17202a;color:#fff;
  padding:11px 22px;border-radius:10px;font-size:13.5px;
  opacity:0;transition:opacity .22s,transform .22s;z-index:9998;
  white-space:nowrap;max-width:92vw;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.22);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#922b21}
.toast.success{background:var(--green)}

/* ── REPORT ── */
.report-table-wrap{
  max-height:50vh;overflow:auto;border:1.5px solid var(--border);
  border-radius:9px;margin-bottom:14px;
}
.report-info{font-size:13px;color:var(--text2);margin-bottom:10px}

.spinning{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:640px){
  .form-grid{grid-template-columns:1fr}
  thead th:nth-child(n+8){display:none}
  tbody td:nth-child(n+8){display:none}
  main{padding:14px 14px 100px}
  .header-top{padding:10px 14px 8px}
  .search-wrap{padding:0 14px 10px}
  .tabs-wrap{padding:0 10px}
  .stats-bar{gap:8px}
  .stat-card{min-width:80px;padding:12px 10px}
  .stat-card .n{font-size:20px}
}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-logo">ระบบทะเบียนครุภัณฑ์</div>
  <div class="loader-sub">สพป.แม่ฮ่องสอน เขต 2</div>
  <div class="loader-bar-wrap"><div class="loader-bar" id="loaderBar"></div></div>
  <div class="loader-status" id="loaderStatus">กำลังโหลด...</div>
</div>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <span class="icon">📋</span>
      <h1>ระบบทะเบียนครุภัณฑ์</h1>
      <p>สำนักงานเขตพื้นที่การศึกษาประถมศึกษาแม่ฮ่องสอน เขต 2</p>
    </div>
    <div class="login-divider"></div>
    <div class="login-field"><label>ชื่อผู้ใช้</label><input type="text" id="loginUser" placeholder="username" autocomplete="username"/></div>
    <div class="login-field"><label>รหัสผ่าน</label><input type="password" id="loginPass" placeholder="password" autocomplete="current-password"/></div>
    <div class="login-err" id="loginErr"></div>
    <button class="btn-login" id="btnLogin" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<header id="appHeader" style="display:none">
  <div class="header-top">
    <div class="header-emblem">📋</div>
    <div class="header-title">
      <h1>ระบบทะเบียนครุภัณฑ์</h1>
      <p>สพป.แม่ฮ่องสอน เขต 2</p>
    </div>
    <div class="header-user">
      <div class="header-user-avatar">👤</div>
      <span class="header-user-name" id="headerUser"></span>
      <button class="btn-logout" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="ค้นหา รายการ รหัส ยี่ห้อ บุคลากร..." autocomplete="off"/>
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>
</header>

<div class="tabs-wrap" id="tabsWrap" style="display:none"></div>

<main id="appMain" style="display:none">
  <div class="stats-bar" id="statsBar"></div>
  <div class="toolbar">
    <div class="toolbar-left">
      <span class="result-text" id="resultText"></span>
    </div>
    <div class="toolbar-right" id="toolbarRight">
      <button class="btn btn-outline" id="btnSync" onclick="doSyncSummary()" style="display:none">↻ sync บัญชีรวม</button>
      <button class="btn btn-orange" id="btnPullDisposed" onclick="doPullDisposed()" style="display:none">🔍 สแกนและดึงรายการ (ชำรุด/เสื่อมสภาพ/สูญ)</button>
      <button class="btn btn-outline" onclick="openReportModal()">📄 รายงาน</button>
      <button class="btn btn-outline" id="btnRefresh" onclick="refreshCurrent()">⟳ รีเฟรช</button>
    </div>
  </div>
  <div class="table-wrap">
    <div class="table-scroll">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="fab-group" id="fabGroup">
  <div class="fab-mini">
    <span class="fab-mini-label">เพิ่มรายการใหม่</span>
    <button class="fab-mini-btn" onclick="openAddModal()">＋</button>
  </div>
</div>
<button class="fab" id="fabBtn" onclick="toggleFab()">✎</button>

<!-- MODAL ADD/EDIT -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
  <div class="modal modal-lg">
    <h2 id="modalTitle">เพิ่มรายการ</h2>
    <div id="multiAddBar" class="add-row-bar">
      <span style="font-size:13px;color:var(--text2)">จำนวนรายการ</span>
      <input type="number" id="numRows" value="1" min="1" max="20" oninput="rebuildMultiRows()"/>
      <button class="btn btn-outline" onclick="addOneRow()">＋ เพิ่มช่อง</button>
    </div>
    <div class="multi-rows" id="multiRowsContainer"></div>
    <div id="modalErr" class="form-err" style="margin-bottom:10px"></div>
    <div class="modal-footer">
      <button class="btn btn-danger-outline" id="btnDelete" onclick="deleteRecord()" style="display:none;margin-right:auto">🗑 ลบ</button>
      <button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" id="btnSave" onclick="saveRecord()">💾 บันทึก</button>
    </div>
  </div>
</div>

<!-- MODAL REPORT -->
<div class="modal-overlay" id="reportOverlay" onclick="closeReportBg(event)">
  <div class="modal modal-lg">
    <h2>📄 ออกรายงาน</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      <select id="reportSheetSel" style="padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:'Noto Sans Thai',sans-serif;outline:none">
        <option value="บัญชีรวม">บัญชีรวม (ทั้งหมด)</option>
        <option value="นิเทศน์">กลุ่มนิเทศน์</option>
        <option value="บุคคล">กลุ่มบุคคล</option>
        <option value="แผน">กลุ่มแผน</option>
        <option value="ICT">กลุ่ม ICT</option>
        <option value="อำนวยการ">กลุ่มอำนวยการ</option>
        <option value="ส่งเสริม">กลุ่มส่งเสริม</option>
        <option value="ตรวจสอบ">กลุ่มตรวจสอบ</option>
        <option value="กฎหมาย">กลุ่มกฎหมาย</option>
        <option value="การเงิน">กลุ่มการเงิน</option>
        <option value="ตัดจำหน่าย">รายการตัดจำหน่าย</option>
      </select>
      <select id="reportStatusSel" style="padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:'Noto Sans Thai',sans-serif;outline:none">
        <option value="">ทุกสภาพ</option>
        <option value="ใช้ได้">ใช้ได้</option>
        <option value="ชำรุด">ชำรุด</option>
        <option value="เสื่อมสภาพ">เสื่อมสภาพ</option>
        <option value="สูญ">สูญ</option>
      </select>
      <button class="btn btn-primary" onclick="loadReport()">ดูรายงาน</button>
      <button class="btn btn-green" onclick="exportCSV()">⬇ Export CSV</button>
    </div>
    <div class="report-info" id="reportInfo"></div>
    <div class="report-table-wrap">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead id="reportHead"></thead>
        <tbody id="reportBody"></tbody>
      </table>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeReportModal()">ปิด</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL  = 'https://script.google.com/macros/s/AKfycbzTDDVNNf1tWm5iM2J9ET95BDI-rjYtjN6418RaIJ0SILS5un-_ykM0GtJOONA6Axtw/exec';
const GROUPS      = ['นิเทศน์','บุคคล','แผน','ICT','อำนวยการ','ส่งเสริม','ตรวจสอบ','กฎหมาย','การเงิน'];
const STATUSES    = ['ใช้ได้','ชำรุด','เสื่อมสภาพ','สูญ'];
const METHODS     = ['งบประมาณ','รวมเขต','ประกวดราคา','เฉพาะเจาะจง','บริจาค','ประกาศราคา','สพฐ.','อื่นๆ'];
const SESSION_KEY = 'mhs2_session';

let currentSheet    = 'นิเทศน์';
let allRecords      = [];
let filteredRecords = [];
let searchQuery     = '';
let editingRecord   = null;
let fabOpen         = false;
let isSaving        = false;
let reportData      = [];

// ── INIT ──────────────────────────────────────────────────
window.addEventListener('load', () => {
  setProgress(10, 'ตรวจสอบ session...');
  const sess = _getSession();
  if (sess) { startApp(sess.display_name); }
  else { setTimeout(() => document.getElementById('loader').classList.add('hidden'), 500); }
});

function startApp(displayName) {
  setProgress(40, 'โหลดข้อมูล...');
  document.getElementById('headerUser').textContent   = displayName;
  document.getElementById('appHeader').style.display  = '';
  document.getElementById('tabsWrap').style.display   = '';
  document.getElementById('appMain').style.display    = '';
  buildTabs();
  loadSheet('นิเทศน์').then(() => {
    setProgress(100, 'พร้อมใช้งาน');
    setTimeout(() => document.getElementById('loader').classList.add('hidden'), 400);
  });
}

function buildTabs() {
  const wrap = document.getElementById('tabsWrap');
  let html = GROUPS.map(g => `<button class="tab-btn" id="tab-${g}" onclick="switchTab('${g}')">${g}</button>`).join('');
  html += `<button class="tab-btn tab-summary" id="tab-บัญชีรวม" onclick="switchTab('บัญชีรวม')">📋 บัญชีรวม</button>`;
  html += `<button class="tab-btn tab-dispose" id="tab-ตัดจำหน่าย" onclick="switchTab('ตัดจำหน่าย')">📤 ตัดจำหน่าย</button>`;
  wrap.innerHTML = html;
  document.getElementById('tab-นิเทศน์').classList.add('active');
}

// ── AUTH ──────────────────────────────────────────────────
async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (!u || !p) { showLoginErr('กรุณากรอก username และ password'); return; }
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  try {
    const res = await api({ action: 'login', username: u, password: await sha256(p) });
    if (res.ok) {
      _saveSession({ username: u, display_name: res.display_name || u });
      document.getElementById('loginScreen').classList.add('hidden');
      startApp(res.display_name || u);
    } else { showLoginErr(res.error || 'เข้าสู่ระบบไม่สำเร็จ'); }
  } catch(e) { showLoginErr('เชื่อมต่อไม่ได้: ' + e.message); }
  btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
}
function doLogout() { localStorage.removeItem(SESSION_KEY); location.reload(); }
function showLoginErr(msg) { const el = document.getElementById('loginErr'); el.textContent = msg; el.style.display = 'block'; }
function _saveSession(d) { localStorage.setItem(SESSION_KEY, JSON.stringify(d)); }
function _getSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(e) { return null; } }

// ── TAB ───────────────────────────────────────────────────
async function switchTab(sheet) {
  currentSheet = sheet;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('tab-' + sheet);
  if (el) el.classList.add('active');

  const isDispose = sheet === 'ตัดจำหน่าย';
  const isSummary = sheet === 'บัญชีรวม';

  // FAB — ซ่อนใน ตัดจำหน่าย และ บัญชีรวม
  document.getElementById('fabBtn').style.display   = (isDispose || isSummary) ? 'none' : '';
  document.getElementById('fabGroup').style.display = (isDispose || isSummary) ? 'none' : '';

  // toolbar buttons
  document.getElementById('btnSync').style.display         = isSummary  ? '' : 'none';
  document.getElementById('btnPullDisposed').style.display = isDispose  ? '' : 'none';

  await loadSheet(sheet);
}

// ── DATA ──────────────────────────────────────────────────
async function loadSheet(sheet) {
  try {
    const res  = await api({ action: 'list', sheet });
    allRecords = res.records || [];
    applyFilter();
    renderStats();
  } catch(e) { showToast('โหลดข้อมูลล้มเหลว: ' + e.message, 'error'); }
}

async function refreshCurrent() {
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('spinning');
  await loadSheet(currentSheet);
  btn.classList.remove('spinning');
  showToast('รีเฟรชแล้ว ✓', 'success');
}

async function doSyncSummary() {
  const btn = document.getElementById('btnSync');
  btn.disabled = true; btn.textContent = '⏳ sync...';
  try {
    const res = await api({ action: 'syncSummary' });
    showToast(`sync บัญชีรวมสำเร็จ (${res.total} รายการ) ✓`, 'success');
    if (currentSheet === 'บัญชีรวม') await loadSheet('บัญชีรวม');
  } catch(e) { showToast('sync ล้มเหลว: ' + e.message, 'error'); }
  btn.disabled = false; btn.textContent = '↻ sync บัญชีรวม';
}

// สแกนและดึงรายการที่ชำรุด/เสื่อมสภาพ/สูญ → ตัดจำหน่าย (ยังไม่ลบต้นทาง)
async function doPullDisposed() {
  const btn = document.getElementById('btnPullDisposed');
  btn.disabled = true; btn.textContent = '⏳ กำลังสแกน...';
  try {
    const res = await api({ action: 'pullDisposed' });
    showToast(`ดึงรายการสำเร็จ ${res.pulled} รายการ ✓`, 'success');
    await loadSheet('ตัดจำหน่าย');
  } catch(e) { showToast('สแกนล้มเหลว: ' + e.message, 'error'); }
  btn.disabled = false; btn.textContent = '🔍 สแกนและดึงรายการ (ชำรุด/เสื่อมสภาพ/สูญ)';
}

// ยืนยันตัดจำหน่ายจริง — ลบต้นทาง
async function confirmDispose(dstRow, group, code, item) {
  if (!confirm(`ยืนยันตัดจำหน่าย "${item}" ?\nรายการจะถูกลบออกจากกลุ่มงาน "${group}" จริงๆ`)) return;
  const sess = _getSession();
  const dispBy = sess?.display_name || sess?.username || 'ระบบ';
  try {
    await api({ action: 'confirmDispose', dstRow, group, code, item, dispBy });
    showToast('ยืนยันตัดจำหน่ายเรียบร้อย ✓', 'success');
    await loadSheet('ตัดจำหน่าย');
  } catch(e) { showToast('ล้มเหลว: ' + e.message, 'error'); }
}

// ── FILTER & RENDER ───────────────────────────────────────
function applyFilter() {
  const q = searchQuery.toLowerCase().replace(/\s/g, '');
  filteredRecords = allRecords.filter(r => {
    if (!q) return true;
    const hay = [r.item, r.brand, r.model, r.serial, r.code, r.group, r.status, r.user, r.method]
      .join(' ').toLowerCase().replace(/\s/g, '');
    return hay.includes(q);
  });
  renderTable();
  const total = filteredRecords.length;
  document.getElementById('resultText').innerHTML = q
    ? `พบ <strong>${total}</strong> รายการ จาก "${escHtml(searchQuery)}"`
    : `<strong>${total}</strong> รายการ`;
}

function renderStats() {
  const ok     = allRecords.filter(r => r.status === 'ใช้ได้').length;
  const broken = allRecords.filter(r => r.status === 'ชำรุด').length;
  const worn   = allRecords.filter(r => r.status === 'เสื่อมสภาพ').length;
  const lost   = allRecords.filter(r => r.status === 'สูญ').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="n">${allRecords.length}</div><div class="l">รายการทั้งหมด</div></div>
    <div class="stat-card green"><div class="n">${ok}</div><div class="l">ใช้ได้</div></div>
    <div class="stat-card orange"><div class="n">${broken}</div><div class="l">ชำรุด</div></div>
    <div class="stat-card orange"><div class="n">${worn}</div><div class="l">เสื่อมสภาพ</div></div>
    <div class="stat-card red"><div class="n">${lost}</div><div class="l">สูญ</div></div>`;
}

function renderTable() {
  const isDispose = currentSheet === 'ตัดจำหน่าย';
  const isSummary = currentSheet === 'บัญชีรวม';

  const headers = isDispose
    ? ['#','รายการ','ยี่ห้อ','รุ่น','Serial','ราคา/หน่วย','รหัสครุภัณฑ์','กลุ่มงาน','สภาพ','ใช้ประจำที่','วันที่ตัด','ผู้ดำเนินการ/สถานะ']
    : ['#','รายการ','ยี่ห้อ','รุ่น','Serial','ราคา/หน่วย','วันที่ได้มา','วิธีได้มา','รหัสครุภัณฑ์','กลุ่มงาน','สภาพ','ใช้ประจำที่/บุคลากร',...(!isSummary ? ['จัดการ'] : [])];

  document.getElementById('tableHead').innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

  const tbody = document.getElementById('tableBody');
  if (filteredRecords.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${headers.length}" style="padding:0"><div class="empty-state"><div class="icon">📭</div><h3>ไม่พบรายการ</h3><p>ลองเปลี่ยนคำค้นหา หรือเพิ่มรายการใหม่</p></div></td></tr>`;
    return;
  }

  tbody.innerHTML = filteredRecords.map((r, i) => {
    const statusBadge = _statusBadge(r.status);
    const priceStr    = r.price && !isNaN(r.price) ? Number(r.price).toLocaleString('th-TH') + ' ฿' : (r.price || '—');

    if (isDispose) {
      const isPending   = r.dispBy === 'รอการยืนยัน';
      const actionCell  = isPending
        ? `<button class="btn-confirm" onclick="confirmDispose(${r.rowIndex},'${escAttr(r.group)}','${escAttr(r.code)}','${escAttr(r.item)}')">✅ ยืนยันตัดจำหน่าย</button>`
        : `<span class="badge badge-done">✓ ตัดแล้ว (${escHtml(r.dispBy)})</span>`;
      return `<tr>
        <td class="td-no">${i+1}</td>
        <td>${escHtml(r.item)}</td>
        <td>${escHtml(r.brand||'')}</td>
        <td>${escHtml(r.model||'')}</td>
        <td class="td-code">${escHtml(r.serial||'')}</td>
        <td class="td-price">${priceStr}</td>
        <td class="td-code">${escHtml(r.code||'')}</td>
        <td>${escHtml(r.group||'')}</td>
        <td class="td-status">${statusBadge}</td>
        <td>${escHtml(r.user||'')}</td>
        <td>${escHtml(r.dispDate||'—')}</td>
        <td>${actionCell}</td>
      </tr>`;
    }

    const actionCol = !isSummary
      ? `<td class="td-actions">
           <button class="btn-icon" onclick="openEditModal(${r.rowIndex})" title="แก้ไข">✏️</button>
           <button class="btn-icon danger" onclick="quickDelete(${r.rowIndex},'${escAttr(r.group||currentSheet)}')" title="ลบ">🗑</button>
         </td>` : '';

    return `<tr>
      <td class="td-no">${r.no||i+1}</td>
      <td>${escHtml(r.item)}</td>
      <td>${escHtml(r.brand||'')}</td>
      <td>${escHtml(r.model||'')}</td>
      <td class="td-code">${escHtml(r.serial||'')}</td>
      <td class="td-price">${priceStr}</td>
      <td>${escHtml(r.date||'')}</td>
      <td>${escHtml(r.method||'')}</td>
      <td class="td-code">${escHtml(r.code||'')}</td>
      <td>${escHtml(r.group||'')}</td>
      <td class="td-status">${statusBadge}</td>
      <td>${escHtml(r.user||'')}</td>
      ${actionCol}
    </tr>`;
  }).join('');
}

function _statusBadge(s) {
  const map = {'ใช้ได้':'badge-ok','ชำรุด':'badge-broken','เสื่อมสภาพ':'badge-worn','สูญ':'badge-lost'};
  return `<span class="badge ${map[s]||'badge-ok'}">${escHtml(s||'ใช้ได้')}</span>`;
}

// ── SEARCH ────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value;
  document.getElementById('searchClear').classList.toggle('visible', this.value.length > 0);
  applyFilter();
});
function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  document.getElementById('searchClear').classList.remove('visible');
  applyFilter();
}

// ── MODAL ─────────────────────────────────────────────────
function openAddModal() {
  editingRecord = null;
  document.getElementById('modalTitle').textContent   = '➕ เพิ่มรายการ';
  document.getElementById('btnDelete').style.display  = 'none';
  document.getElementById('multiAddBar').style.display = '';
  document.getElementById('numRows').value = '1';
  document.getElementById('modalErr').style.display   = 'none';
  rebuildMultiRows();
  document.getElementById('modalOverlay').classList.add('open');
  if (fabOpen) toggleFab();
}

function openEditModal(rowIndex) {
  const r = allRecords.find(x => x.rowIndex === rowIndex);
  if (!r) return;
  editingRecord = r;
  document.getElementById('modalTitle').textContent    = '✏️ แก้ไขรายการ';
  document.getElementById('btnDelete').style.display   = 'inline-flex';
  document.getElementById('multiAddBar').style.display = 'none';
  document.getElementById('modalErr').style.display    = 'none';
  document.getElementById('multiRowsContainer').innerHTML = buildRowForm(r, 0, true);
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalBg(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

// ── FORM BUILDER ──────────────────────────────────────────
function buildRowForm(data, idx, isEdit=false) {
  const d = data || {};
  const groupOpts  = GROUPS.map(g => `<option value="${g}" ${(d.group||currentSheet)===g?'selected':''}>${g}</option>`).join('');
  const statusOpts = STATUSES.map(s => `<option value="${s}" ${(d.status||'ใช้ได้')===s?'selected':''}>${s}</option>`).join('');
  const methodOpts = METHODS.map(m => `<option value="${m}" ${(d.method||'')===m?'selected':''}>${m}</option>`).join('');

  return `
  <div class="multi-row" id="row-${idx}">
    ${!isEdit ? `<div class="multi-row-num">รายการที่ ${idx+1}</div>` : ''}
    ${!isEdit && idx > 0 ? `<button class="remove-row" onclick="removeRow(${idx})">✕</button>` : ''}
    <label class="bundle-toggle">
      <input type="checkbox" id="isBundle-${idx}" onchange="toggleBundle(${idx})">
      <span>📦 ได้รับเป็นชุด (เช่น คอมพิวเตอร์+จอ, โต๊ะ+เก้าอี้)</span>
    </label>
    <div class="form-grid">
      <div class="form-group form-full"><label>รายการ *</label><input type="text" id="item-${idx}" value="${escHtml(d.item||'')}" placeholder="เช่น คอมพิวเตอร์แบบตั้งโต๊ะ"/></div>
      <div class="form-group"><label>ยี่ห้อ</label><input type="text" id="brand-${idx}" value="${escHtml(d.brand||'')}"/></div>
      <div class="form-group"><label>รุ่น</label><input type="text" id="model-${idx}" value="${escHtml(d.model||'')}"/></div>
      <div class="form-group"><label>Serial Number</label><input type="text" id="serial-${idx}" value="${escHtml(d.serial||'')}"/></div>
      <div class="form-group"><label>ราคา/หน่วย (บาท)</label><input type="text" id="price-${idx}" value="${escHtml(String(d.price||''))}" placeholder="0.00"/></div>
      <div class="form-group"><label>วันที่ได้มา</label><input type="text" id="date-${idx}" value="${escHtml(d.date||'')}" placeholder="เช่น 22/01/61"/></div>
      <div class="form-group"><label>วิธีได้มา</label><select id="method-${idx}"><option value="">-- เลือก --</option>${methodOpts}</select></div>
      <div class="form-group"><label>รหัสครุภัณฑ์ *</label><input type="text" id="code-${idx}" value="${escHtml(d.code||'')}" placeholder="เช่น มส2/1/100/61-1"/></div>
      <div class="form-group"><label>กลุ่มงาน</label><select id="group-${idx}">${groupOpts}</select></div>
      <div class="form-group"><label>สภาพครุภัณฑ์</label><select id="status-${idx}">${statusOpts}</select></div>
      <div class="form-group form-full"><label>ใช้ประจำที่ / บุคลากร</label><input type="text" id="user-${idx}" value="${escHtml(d.user||'')}" placeholder="เช่น ศน.สิทธิพงษ์"/></div>
    </div>
    <div class="bundle-section" id="bundleSection-${idx}">
      <h4>รายการที่ 2 (อุปกรณ์คู่)</h4>
      <div class="form-grid">
        <div class="form-group form-full"><label>รายการ (อุปกรณ์คู่) *</label><input type="text" id="b-item-${idx}" placeholder="เช่น จอ HP"/></div>
        <div class="form-group"><label>ยี่ห้อ</label><input type="text" id="b-brand-${idx}"/></div>
        <div class="form-group"><label>รุ่น</label><input type="text" id="b-model-${idx}"/></div>
        <div class="form-group"><label>Serial Number</label><input type="text" id="b-serial-${idx}"/></div>
        <div class="form-group"><label>ราคา/หน่วย</label><input type="text" id="b-price-${idx}" placeholder="ราคารวมกับรายการหลัก" disabled style="background:var(--surface2);color:var(--text3)"/></div>
        <div class="form-group"><label>รหัสครุภัณฑ์ *</label><input type="text" id="b-code-${idx}" placeholder="เช่น มส2/1/100/61-1จ"/></div>
        <div class="form-group form-full"><label>ใช้ประจำที่ / บุคลากร</label><input type="text" id="b-user-${idx}"/></div>
      </div>
    </div>
  </div>`;
}

function rebuildMultiRows() {
  const n = Math.max(1, Math.min(20, parseInt(document.getElementById('numRows').value)||1));
  const con = document.getElementById('multiRowsContainer');
  con.innerHTML = '';
  for (let i = 0; i < n; i++) con.innerHTML += buildRowForm(null, i);
}
function addOneRow() {
  const con = document.getElementById('multiRowsContainer');
  const n = con.querySelectorAll('.multi-row').length;
  document.getElementById('numRows').value = n + 1;
  con.innerHTML += buildRowForm(null, n);
}
function removeRow(idx) {
  const el = document.getElementById('row-' + idx);
  if (el) el.remove();
  document.getElementById('numRows').value = document.getElementById('multiRowsContainer').querySelectorAll('.multi-row').length;
}
function toggleBundle(idx) {
  document.getElementById('bundleSection-' + idx).classList.toggle('open', document.getElementById('isBundle-' + idx).checked);
}

// ── SAVE ──────────────────────────────────────────────────
async function saveRecord() {
  if (isSaving) return;
  document.getElementById('modalErr').style.display = 'none';

  if (editingRecord) {
    const d = _readRow(0);
    if (!d) return;
    setBusy(true);
    try {
      await api({ action: 'update', rowIndex: editingRecord.rowIndex, data: JSON.stringify(d) });
      showToast('อัปเดตเรียบร้อย ✓', 'success');
      closeModal();
      await loadSheet(currentSheet);
    } catch(e) { showModalErr(e.message); }
    setBusy(false);
    return;
  }

  const rows = document.getElementById('multiRowsContainer').querySelectorAll('.multi-row');
  const payloads = [];
  for (let i = 0; i < rows.length; i++) {
    const d = _readRow(i);
    if (!d) return;
    payloads.push(d);
  }
  setBusy(true);
  try {
    for (const d of payloads) await api({ action: 'add', data: JSON.stringify(d) });
    showToast(`บันทึก ${payloads.length} รายการเรียบร้อย ✓`, 'success');
    closeModal();
    await loadSheet(currentSheet);
  } catch(e) { showModalErr(e.message); }
  setBusy(false);
}

function _readRow(idx) {
  const v = id => { const el = document.getElementById(`${id}-${idx}`); return el ? el.value.trim() : ''; };
  const item = v('item'), code = v('code');
  if (!item) { showModalErr(`รายการที่ ${idx+1}: กรุณาระบุ "รายการ"`); return null; }
  if (!code) { showModalErr(`รายการที่ ${idx+1}: กรุณาระบุ "รหัสครุภัณฑ์"`); return null; }
  const isBundle = document.getElementById(`isBundle-${idx}`)?.checked;
  const bItem = isBundle ? v('b-item') : '';
  const bCode = isBundle ? v('b-code') : '';
  if (isBundle && !bItem) { showModalErr(`รายการที่ ${idx+1}: กรุณาระบุ "รายการ" ของอุปกรณ์คู่`); return null; }
  if (isBundle && !bCode) { showModalErr(`รายการที่ ${idx+1}: กรุณาระบุ "รหัสครุภัณฑ์" ของอุปกรณ์คู่`); return null; }
  return {
    item, brand: v('brand'), model: v('model'), serial: v('serial'),
    price: v('price'), date: v('date'), method: v('method'),
    code, group: v('group')||currentSheet, status: v('status')||'ใช้ได้', user: v('user'),
    isBundle,
    bundle: isBundle ? { item: bItem, brand: v('b-brand'), model: v('b-model'), serial: v('b-serial'), code: bCode, user: v('b-user') } : null,
  };
}

function showModalErr(msg) { const el = document.getElementById('modalErr'); el.textContent = msg; el.style.display = 'block'; }
function setBusy(busy) {
  isSaving = busy;
  document.getElementById('btnSave').disabled = busy;
  document.getElementById('btnSave').textContent = busy ? '⏳ กำลังบันทึก...' : '💾 บันทึก';
}

// ── DELETE ────────────────────────────────────────────────
async function deleteRecord() {
  if (!editingRecord) return;
  if (!confirm(`ลบ "${editingRecord.item}" ?\nไม่สามารถย้อนกลับได้`)) return;
  setBusy(true);
  try {
    await api({ action: 'delete', rowIndex: editingRecord.rowIndex, group: editingRecord.group||currentSheet });
    showToast('ลบเรียบร้อย ✓', 'success');
    closeModal();
    await loadSheet(currentSheet);
  } catch(e) { showModalErr(e.message); }
  setBusy(false);
}

async function quickDelete(rowIndex, group) {
  const r = allRecords.find(x => x.rowIndex === rowIndex);
  if (!confirm(`ลบ "${r?.item||'รายการนี้'}" ?`)) return;
  try {
    await api({ action: 'delete', rowIndex, group });
    showToast('ลบเรียบร้อย ✓', 'success');
    await loadSheet(currentSheet);
  } catch(e) { showToast('ลบล้มเหลว: ' + e.message, 'error'); }
}

// ── REPORT ────────────────────────────────────────────────
function openReportModal() {
  document.getElementById('reportOverlay').classList.add('open');
  document.getElementById('reportSheetSel').value  = currentSheet === 'ตัดจำหน่าย' ? 'ตัดจำหน่าย' : (currentSheet === 'บัญชีรวม' ? 'บัญชีรวม' : currentSheet);
  document.getElementById('reportStatusSel').value = '';
  document.getElementById('reportHead').innerHTML  = '';
  document.getElementById('reportBody').innerHTML  = '';
  document.getElementById('reportInfo').textContent = '';
  reportData = [];
}
async function loadReport() {
  const sheet = document.getElementById('reportSheetSel').value;
  const status = document.getElementById('reportStatusSel').value;
  try {
    const res  = await api({ action: 'report', sheet });
    reportData = (res.records||[]).filter(r => !status || r.status === status);
    renderReport();
  } catch(e) { showToast('โหลดรายงานล้มเหลว: ' + e.message, 'error'); }
}
function renderReport() {
  const isDispose = document.getElementById('reportSheetSel').value === 'ตัดจำหน่าย';
  document.getElementById('reportInfo').textContent = `แสดง ${reportData.length} รายการ`;
  const headers = isDispose
    ? ['#','รายการ','ยี่ห้อ','รุ่น','Serial','ราคา/หน่วย','รหัสครุภัณฑ์','กลุ่มงาน','สภาพ','ใช้ประจำที่','วันที่ตัด','ผู้ดำเนินการ']
    : ['#','รายการ','ยี่ห้อ','รุ่น','Serial','ราคา/หน่วย','วันที่ได้มา','วิธีได้มา','รหัสครุภัณฑ์','กลุ่มงาน','สภาพ','ใช้ประจำที่'];
  document.getElementById('reportHead').innerHTML =
    `<tr style="background:var(--primary);color:#fff">${headers.map(h=>`<th style="padding:8px 12px;text-align:left;font-size:11px;white-space:nowrap">${h}</th>`).join('')}</tr>`;
  document.getElementById('reportBody').innerHTML = reportData.map((r,i) => {
    const priceStr = r.price && !isNaN(r.price) ? Number(r.price).toLocaleString('th-TH') : (r.price||'');
    const cells = isDispose
      ? [i+1,r.item,r.brand,r.model,r.serial,priceStr,r.code,r.group,r.status,r.user,r.dispDate,r.dispBy]
      : [i+1,r.item,r.brand,r.model,r.serial,priceStr,r.date,r.method,r.code,r.group,r.status,r.user];
    return `<tr style="border-bottom:1px solid var(--border)">${cells.map(c=>`<td style="padding:7px 12px">${escHtml(String(c||''))}</td>`).join('')}</tr>`;
  }).join('');
}
function exportCSV() {
  if (!reportData.length) { showToast('กรุณาดูรายงานก่อน','error'); return; }
  const isDispose = document.getElementById('reportSheetSel').value === 'ตัดจำหน่าย';
  const hdr = isDispose
    ? ['ลำดับ','รายการ','ยี่ห้อ','รุ่น','Serial','ราคา/หน่วย','รหัสครุภัณฑ์','กลุ่มงาน','สภาพ','ใช้ประจำที่','วันที่ตัด','ผู้ดำเนินการ']
    : ['ลำดับ','รายการ','ยี่ห้อ','รุ่น','Serial','ราคา/หน่วย','วันที่ได้มา','วิธีได้มา','รหัสครุภัณฑ์','กลุ่มงาน','สภาพ','ใช้ประจำที่'];
  const rows = reportData.map((r,i) => isDispose
    ? [i+1,r.item,r.brand,r.model,r.serial,r.price,r.code,r.group,r.status,r.user,r.dispDate,r.dispBy]
    : [i+1,r.item,r.brand,r.model,r.serial,r.price,r.date,r.method,r.code,r.group,r.status,r.user]);
  const csv = '\uFEFF' + [hdr,...rows].map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),
    download: `รายงาน_${document.getElementById('reportSheetSel').value}_${new Date().toLocaleDateString('th-TH')}.csv`
  });
  a.click();
}
function closeReportModal() { document.getElementById('reportOverlay').classList.remove('open'); }
function closeReportBg(e) { if (e.target === document.getElementById('reportOverlay')) closeReportModal(); }

// ── FAB ───────────────────────────────────────────────────
function toggleFab() {
  fabOpen = !fabOpen;
  document.getElementById('fabGroup').classList.toggle('open', fabOpen);
  document.getElementById('fabBtn').style.background = fabOpen ? 'var(--primary)' : '';
}

// ── API ───────────────────────────────────────────────────
async function api(params) {
  const url = SCRIPT_URL + '?' + new URLSearchParams(params);
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

// ── UTIL ──────────────────────────────────────────────────
function setProgress(pct, msg) {
  document.getElementById('loaderBar').style.width = pct + '%';
  if (msg) document.getElementById('loaderStatus').textContent = msg;
}
let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 3000);
}
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeReportModal(); if (fabOpen) toggleFab(); }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('searchInput').focus(); }
});
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
