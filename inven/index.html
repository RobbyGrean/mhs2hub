<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เบิกพัสดุ</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body data-mode="requester">
    <div id="loadingOverlay" class="loading-overlay">
      <div class="loading-box">
        <div class="spinner"></div>
        <strong id="loadingText">กำลังโหลดข้อมูล...</strong>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <header class="app-header">
      <div>
        <h1>เบิกพัสดุ</h1>
        <p>เลือกฝ่าย กรอกชื่อ แล้วบันทึกการเบิก</p>
      </div>
    </header>

    <main>
      <section id="withdraw" class="panel active">
        <div class="grid two">
          <label>ฝ่าย
            <select id="withdrawDept"></select>
          </label>
          <label>ชื่อผู้เบิก
            <div class="inline-field">
              <select id="withdrawRequesterStaff"></select>
              <button type="button" onclick="openStaffDialog()">+ เพิ่มชื่อ</button>
            </div>
          </label>
        </div>
        <div id="withdrawLines"></div>
        <button onclick="addWithdrawLine()">+ เพิ่มรายการ</button>
        <button class="primary" onclick="submitWithdrawal()">บันทึกเบิก</button>
        <p id="withdrawMessage" class="message"></p>
        <div id="itemGuide" class="item-guide"></div>
      </section>
    </main>

    <dialog id="staffDialog">
      <form method="dialog" class="dialog-body">
        <h2>เพิ่มรายชื่อเจ้าหน้าที่</h2>
        <div class="grid two">
          <label>คำนำหน้า
            <select id="staffPrefix">
              <option>นาย</option>
              <option>นาง</option>
              <option>นางสาว</option>
            </select>
          </label>
          <label>ตำแหน่ง
            <input id="staffPosition" placeholder="เช่น นักวิชาการศึกษา">
          </label>
        </div>
        <div class="grid two">
          <label>ชื่อ
            <input id="staffFirstName">
          </label>
          <label>นามสกุล
            <input id="staffLastName">
          </label>
        </div>
        <div class="dialog-actions">
          <button type="button" onclick="closeStaffDialog()">ปิด</button>
          <button type="button" class="primary" onclick="submitNewDepartmentStaff()">บันทึกชื่อ</button>
        </div>
      </form>
    </dialog>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
