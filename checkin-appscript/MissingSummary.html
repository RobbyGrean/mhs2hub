<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Sarabun', sans-serif; padding: 15px; background: #fff5f5; }
    .header { color: #dc3545; font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 10px; }
    .count-box { text-align: center; font-size: 16px; margin-bottom: 15px; color: #555; }
    .list-area { background: white; border-radius: 8px; height: 400px; overflow-y: auto; border: 1px solid #feb2b2; }
    .item { padding: 10px; border-bottom: 1px solid #eee; color: #c53030; }
    .item:nth-child(even) { background: #fffaf0; }
  </style>
</head>
<body>
  <div class="header">❌ ยังไม่มาเช็คอิน</div>
  <div id="count" class="count-box">กำลังโหลด...</div>
  <div class="list-area" id="list"></div>
  <script>
    google.script.run.withSuccessHandler(function(data) {
      document.getElementById('count').innerText = 'คงเหลือ: ' + data.missing.length + ' / ' + data.totalAll + ' แห่ง';
      const html = data.missing.map(s => `<div class="item">🔴 ${s}</div>`).join('');
      document.getElementById('list').innerHTML = html || '<div style="padding:20px;text-align:center;color:green;">✅ มาครบถ้วนทุกโรงเรียนแล้ว</div>';
    }).getMeetingStatus();
  </script>
</body>
</html>
